name: Build APK

# Builds the Android app on GitHub's free runners (no laptop needed) and
# publishes the APK as a GitHub Release you can download on your phone.
on:
  push:
    branches: [main]
    paths-ignore: ['config/**', '**.md']   # config changes reach the app via jsDelivr, no rebuild needed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_CONFIG_REPO: ${{ github.repository }}
      - run: npm run cap -- sync android

      - name: Write signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret not set - using a throwaway debug key (updates will need uninstall)."
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/none.p12" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/SastaKahan.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SastaKahan-apk
          path: ${{ runner.temp }}/SastaKahan.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="1.2.${{ github.run_number }}"
          {
            echo "Download **SastaKahan.apk** on your phone and install it (it updates the app you already have)."
            echo
            if [ -f release-notes.md ]; then cat release-notes.md; fi
          } > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" "$RUNNER_TEMP/SastaKahan.apk" \
            --title "SastaKahan $version" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
