name: Daily site check

# Every morning (IST), search a few products on each site with the same parsers the app uses.
# If a site's page loads but no products can be read from it, open (or update) an issue.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/health-check.ts --out report.md
      - run: cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update an issue for broken sites
        if: hashFiles('broken-sites.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Site check: $(cat broken-sites.txt) not readable"
          existing=$(gh issue list --state open --label site-check --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file report.md
          else
            gh label create site-check --color FBCA04 --description "Daily site check" 2>/dev/null || true
            gh issue create --title "$title" --label site-check --body-file report.md
          fi
